name: Verify revised numerical figures
on: [push, pull_request, workflow_dispatch]
jobs:
  numerical-and-document-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install figure dependencies
        run: python -m pip install -r requirements_figures.txt
      - name: Check committed figure sources and publication PDFs
        run: python scripts/check_revision_figures.py
      - name: Rebuild publication figures from corrected sources
        run: python scripts/plot_revision_all.py
      - name: Verify regenerated figures and numerical identities
        run: python scripts/check_revision_figures.py